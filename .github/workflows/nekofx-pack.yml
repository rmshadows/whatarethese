# 在 Linux / Windows / macOS 上各打一份 NekoFX 原生包。
# jpackage 不能交叉编译，所以三个 runner 都要跑。
name: NekoFX pack

on:
  workflow_dispatch:
  push:
    paths:
      - "NekoFX/**"
      - ".github/workflows/nekofx-pack.yml"

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NekoFX
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Tools for .deb
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg-dev
      - name: Pack
        run: bash pack/pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NekoFX-linux
          path: NekoFX/dist/*

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: NekoFX
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Pack
        shell: cmd
        run: pack\pack.bat
      - uses: actions/upload-artifact@v4
        with:
          name: NekoFX-windows
          path: NekoFX/dist/*

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: NekoFX
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Pack
        run: bash pack/pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NekoFX-macos
          path: NekoFX/dist/*
